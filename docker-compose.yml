name: loopclose

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loopclose
      POSTGRES_PASSWORD: loopclose
      POSTGRES_DB: loopclose
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopclose -d loopclose"]
      interval: 5s
      timeout: 3s
      retries: 20

  hapi:
    image: hapiproject/hapi:v8.0.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_CONFIG_LOCATION: file:///app/config/application.yaml
    volumes:
      - ./infra/hapi/application.yaml:/app/config/application.yaml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/fhir/metadata >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      hapi:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://loopclose:loopclose@postgres:5432/loopclose
      FHIR_BASE_URL: http://hapi:8080/fhir
      SMTP_HOST: mailhog
    ports:
      - "4000:4000"

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
