# Render Blueprint for the LoopClose hosted sandbox (API + Postgres). Web runs on Vercel.
databases:
  - name: loopclose-db
    plan: free
    region: singapore
    databaseName: loopclose
    user: loopclose
    postgresMajorVersion: "16"

services:
  - type: web
    name: loopclose-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loopclose-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: loopclose-sandbox
      - key: CORS_ORIGIN
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SANDBOX
        value: "true"
      - key: CHANNEL_WHATSAPP_MODE
        value: simulated
      - key: LOG_LEVEL
        value: info
