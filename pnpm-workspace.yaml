packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 requires explicit approval for dependency build scripts.
allowBuilds:
  "@parcel/watcher": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  "@nestjs/core": true
  "@tailwindcss/oxide": true
  sharp: true
  unrs-resolver: true
